<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nick's Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #11171b;
    --panel: #1a2126;
    --panel-alt: #1e262b;
    --line: #2b363c;
    --text: #e9e6dc;
    --text-dim: #838f96;
    --text-faint: #56626a;
    --green: #6ba58c;
    --green-dim: #3d5c4e;
    --amber: #cf9a58;
    --amber-dim: #6b5335;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    overflow-x:hidden;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- HERO ---------- */
  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8vh 8vw;
    position:relative;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute;
    inset:0;
    background:url('radar-bg.png') center 40%/cover no-repeat;
    opacity:0.16;
    z-index:0;
  }
  .hero::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, transparent 0%, transparent 55%, var(--bg) 100%);
    z-index:0;
  }
  .hero > *{
    position:relative;
    z-index:1;
  }
  .hero-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:0.15em;
    color:var(--text-faint);
    text-transform:uppercase;
    margin-bottom:1.5rem;
  }
  .hero-eyebrow span{color:var(--green);}
  .hero h1{
    font-size:clamp(2.6rem, 7vw, 5.6rem);
    font-weight:700;
    line-height:1.02;
    letter-spacing:-0.02em;
    max-width:14ch;
  }
  .hero-sub{
    margin-top:1.75rem;
    max-width:46ch;
    font-size:1.05rem;
    color:var(--text-dim);
    line-height:1.6;
  }
  .hero-strip{
    margin-top:3.5rem;
    display:flex;
    gap:0;
    max-width:640px;
    height:34px;
    border:1px solid var(--line);
    background:var(--panel-alt);
  }
  .hero-strip div{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.05em;
    transition:width 0.6s ease;
  }
  .strip-seg{ color:#cfe6da; }
  .hero-legend{
    margin-top:0.9rem;
    display:flex;
    gap:2rem;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  .hero-legend .dot{
    display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:1px;
  }
  .scroll-cue{
    position:absolute;
    bottom:6vh;
    left:8vw;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--text-faint);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .scroll-cue::after{
    content:'';
    width:1px;height:26px;
    background:var(--text-faint);
    animation:cue 1.8s ease-in-out infinite;
  }
  @keyframes cue{
    0%{transform:scaleY(0);transform-origin:top;}
    50%{transform:scaleY(1);transform-origin:top;}
    50.01%{transform-origin:bottom;}
    100%{transform:scaleY(0);transform-origin:bottom;}
  }

  /* ---------- SECTION HEADER ---------- */
  .section-head{
    padding:10vh 8vw 4vh;
  }
  .section-head .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:0.8rem;
  }
  .section-head h2{
    font-size:clamp(1.8rem,4vw,2.6rem);
    font-weight:600;
    letter-spacing:-0.01em;
    max-width:20ch;
  }
  .section-head p{
    margin-top:1rem;
    max-width:52ch;
    color:var(--text-dim);
    line-height:1.6;
  }

  /* ---------- STRIP CARDS (facilities) ---------- */
  .board{
    padding:0 8vw 12vh;
    display:flex;
    flex-direction:column;
    gap:1.1rem;
    min-height:120px;
  }
  .board-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--text-faint);
    padding:1rem 0;
  }
  .board-status.error{ color:var(--amber); }
  .strip-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--green);
    display:grid;
    grid-template-columns:220px 1fr 140px;
    align-items:stretch;
    opacity:0;
    transform:translateX(-56px);
    transition:transform 0.7s cubic-bezier(.16,.8,.3,1), opacity 0.7s ease;
  }
  .strip-card.lux{ border-left-color:var(--amber); }
  .strip-card.in-right{ transform:translateX(56px); }
  .strip-card.visible{ opacity:1; transform:translateX(0); }

  .strip-id{
    padding:1.4rem 1.5rem;
    display:flex;
    flex-direction:column;
    justify-content:center;
    border-right:1px solid var(--line);
  }
  .strip-id .code{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
    letter-spacing:0.08em;
  }
  .strip-id .name{
    font-size:1.25rem;
    font-weight:600;
    margin-top:0.3rem;
  }

  .strip-rows{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0.7rem 1.5rem;
    gap:0;
  }
  .pos-row{
    display:grid;
    grid-template-columns:110px 1fr 60px 60px;
    gap:0.75rem;
    align-items:center;
    padding:0.45rem 0;
    border-bottom:1px dashed var(--line);
    font-size:13px;
  }
  .pos-row:last-child{ border-bottom:none; }
  .pos-row .code{
    font-family:'IBM Plex Mono',monospace;
    color:var(--text-dim);
    font-size:12px;
  }
  .pos-row .label{ color:var(--text); }
  .pos-row .hrs{
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
    color:var(--text-dim);
    font-size:12px;
  }
  .pos-row .pct{
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
    font-size:12px;
    color:var(--green);
  }
  .strip-card.lux .pos-row .pct{ color:var(--amber); }

  .strip-total{
    border-left:1px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0.2rem;
    padding:1rem;
  }
  .strip-total .hours{
    font-family:'IBM Plex Mono',monospace;
    font-size:1.6rem;
    font-weight:600;
  }
  .strip-total .pct{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--green);
  }
  .strip-card.lux .strip-total .pct{ color:var(--amber); }
  .strip-total .lbl{
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-top:0.3rem;
  }

  /* ---------- TOTALS BAND ---------- */
  .totals{
    padding:8vh 8vw 10vh;
    border-top:1px solid var(--line);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
    background:var(--line);
  }
  .totals .cell{
    background:var(--bg);
    padding:2.2rem 1.6rem;
    opacity:0;
    transform:translateY(30px);
    transition:transform 0.6s ease, opacity 0.6s ease;
  }
  .totals .cell.visible{ opacity:1; transform:translateY(0); }
  .totals .cell .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:2.4rem;
    font-weight:600;
  }
  .totals .cell .lbl{
    margin-top:0.5rem;
    font-size:13px;
    color:var(--text-dim);
  }

  /* ---------- FOOTER ---------- */
  footer{
    padding:8vh 8vw;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:1rem;
  }
  footer p{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
    letter-spacing:0.05em;
  }

  @media (max-width:760px){
    .strip-card{ grid-template-columns:1fr; }
    .strip-id{ border-right:none; border-bottom:1px solid var(--line); }
    .strip-total{ border-left:none; border-top:1px solid var(--line); flex-direction:row; justify-content:space-between; }
    .pos-row{ grid-template-columns:80px 1fr 50px 50px; }
    .totals{ grid-template-columns:1fr; }
    .tl-map-row{ flex-direction:column; align-items:stretch; }
    .map-section{ flex-basis:auto; padding:0 8vw 12vh; }
    .map-wrap{ width:33.333vw; margin:0 auto; }
  }

  /* ---------- TIMELINE ---------- */
  .timeline-section{
    padding:0 8vw 12vh;
  }
  .timeline{
    position:relative;
    max-width:760px;
  }
  .timeline::before{
    content:'';
    position:absolute;
    left:7px;
    top:6px;
    bottom:6px;
    width:1px;
    background:var(--line);
  }
  .tl-item{
    position:relative;
    padding:0 0 2.1rem 2.6rem;
    opacity:0;
    transform:translateY(18px);
    transition:transform 0.6s cubic-bezier(.16,.8,.3,1), opacity 0.6s ease;
  }
  .tl-item.visible{ opacity:1; transform:translateY(0); }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-dot{
    position:absolute;
    left:0;
    top:5px;
    width:15px;
    height:15px;
    border-radius:50%;
    background:var(--bg);
    border:2px solid var(--green-dim);
  }
  .tl-dot::after{
    content:'';
    position:absolute;
    inset:3px;
    border-radius:50%;
    background:var(--green);
  }
  .tl-item.lux .tl-dot{ border-color:var(--amber-dim); }
  .tl-item.lux .tl-dot::after{ background:var(--amber); }
  .tl-date{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.05em;
    color:var(--green);
  }
  .tl-item.lux .tl-date{ color:var(--amber); }
  .tl-row{
    margin-top:0.4rem;
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:0.6rem;
  }
  .tl-name{
    font-size:1.05rem;
    font-weight:600;
  }
  .tl-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--text-faint);
  }

  /* ---------- TIMELINE + MAP ROW ---------- */
  .tl-map-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
  }

  /* ---------- MAP ---------- */
  .map-section{
    flex:1 1 260px;
    padding:0 8vw 12vh 0;
  }
  .map-wrap{
    position:relative;
    border:1px solid var(--line);
    background:var(--panel-alt);
    padding:clamp(1rem, 3vw, 2.4rem);
    width:33.333vw;
    margin:0 0 0 auto;
  }
  .map-wrap svg{
    width:100%;
    height:auto;
    display:block;
  }
  .map-land{
    fill:var(--panel);
    stroke:var(--line);
    stroke-width:1;
  }
  .map-borders{
    fill:none;
    stroke:var(--line);
    stroke-width:0.6;
  }
  .map-dot{
    fill:var(--green);
    fill-opacity:0.75;
    stroke:var(--bg);
    stroke-width:1;
    cursor:pointer;
    opacity:0;
    transform:scale(0.4);
    transform-box:fill-box;
    transform-origin:center;
    transition:opacity 0.5s ease, transform 0.5s cubic-bezier(.16,.8,.3,1), fill-opacity 0.15s ease, r 0.15s ease;
  }
  .map-dot.visible{ opacity:1; transform:scale(1); }
  .map-dot.lux{ fill:var(--amber); }
  .map-dot:hover, .map-dot.active{ fill-opacity:1; }
  .map-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--text-faint);
    padding:1rem 0;
  }
  .map-tooltip{
    position:absolute;
    left:0; top:0;
    pointer-events:none;
    background:var(--panel);
    border:1px solid var(--line);
    padding:0.55rem 0.75rem;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    white-space:nowrap;
    transform:translate(-50%,calc(-100% - 14px));
    opacity:0;
    transition:opacity 0.15s ease;
    z-index:5;
  }
  .map-tooltip.visible{ opacity:1; }
  .map-tooltip .t-name{ color:var(--text); font-weight:600; }
  .map-tooltip .t-meta{ color:var(--text-dim); margin-top:2px; }

  @media (prefers-reduced-motion:reduce){
    .strip-card, .totals .cell{ transition:opacity 0.4s ease; transform:none !important; }
    .scroll-cue::after{ animation:none; }
    .map-dot{ transition:opacity 0.3s ease; transform:none !important; }
  }

  /* ---------- FREQUENCY BADGE ---------- */
  #freq-badge{
    position:absolute;
    right:40px;
    bottom:40px;
    z-index:2;
    display:inline-flex;
    align-items:center;
    gap:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    padding:1.1rem 1.5rem;
    color:var(--text);
    max-width:calc(100vw - 80px);
  }
  #freq-badge .dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--text-faint);
    flex-shrink:0;
  }
  #freq-badge.live .dot{ background:var(--green); }
  #freq-badge .text{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:4px;
    line-height:1.15;
  }
  #freq-badge .status{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--text-faint);
    text-transform:uppercase;
  }
  #freq-badge .pos{
    font-size:19px;
    font-weight:600;
  }
  @media (max-width:480px){
    #freq-badge{ right:20px; bottom:20px; padding:0.7rem 1rem; }
  }
</style>
</head>
<body>

<section class="hero">

  <div id="freq-badge">
    <span class="dot"></span>
    <span class="text">
      <span class="status" id="freq-status">checking&hellip;</span>
      <span class="pos" id="freq-position"></span>
    </span>
  </div>

  <h1 id="hero-hours">&hellip; hours<br>on frequency.</h1>
  <p class="hero-sub">A working log of all my control throughout European airspace.</p>
  <div class="hero-strip" id="hero-strip"></div>
  <div class="hero-legend" id="hero-legend"></div>
</section>

<section class="section-head">
  <h2>Where I control</h2>
</section>

<div class="board" id="board">
  <div class="board-status" id="board-status">Fetching live data from the sheet&hellip;</div>
</div>

<section class="section-head">
  <h2>Timeline</h2>
  <p>My first session on each position, starting from the ground up</p>
</section>

<div class="tl-map-row">
<div class="timeline-section">
  <div class="timeline" id="timeline"></div>
</div>

<div class="map-section">
  <div class="map-wrap" id="map-wrap">
    <div class="map-status" id="map-status">Waiting on facility data&hellip;</div>

    UB:[40.4,47.6]
  };

  function projectPoint(lat, lon){
    return [ MAP_PROJ.ax * lon + MAP_PROJ.bx, MAP_PROJ.ay * lat + MAP_PROJ.by ];
  }

  function resolveCoord(icao){
    if(AIRPORT_COORDS[icao]) return AIRPORT_COORDS[icao];
    const p2 = icao.slice(0,2);
    if(COUNTRY_FALLBACK[p2]) return COUNTRY_FALLBACK[p2];
    return null;
  }

  async function loadData(){
    const statusEl = document.getElementById('board-status');
    try{
      const res = await fetch(SHEET_URL, { cache: "no-store" });
      if(!res.ok) throw new Error("Sheet request failed: " + res.status);
      const csvText = await res.text();
      const rows = parseCsv(csvText);
      rows.shift(); // header row

      const facilities = [];
      const countries = [];
      let current = null;
      let totalHours = null;

      rows.forEach(r => {
        const [pos, name, hours, perc, ad, adHours, adPerc, country, countryHours, countryPerc] = r;
        if(!pos) return;
        if(pos.toUpperCase() === "TOTAL"){
          totalHours = hours || totalHours;
          return;
        }
        if(ad){
          current = { adName: ad, hours: adHours, perc: adPerc, icao: pos.split("_")[0], positions: [] };
          facilities.push(current);
        }
        if(current){
          current.positions.push({ pos, name, hours, perc });
        }
        if(country){
          countries.push({ name: country, hours: countryHours, perc: countryPerc });
        }
      });

      renderHero(countries, totalHours);
      renderFacilities(facilities);
      renderTotals(facilities, totalHours);
      renderMap(facilities);
      statusEl.remove();
    }catch(err){
      statusEl.textContent = "Couldn't load live data from the sheet (" + err.message + "). Check the publish link is still active.";
      statusEl.classList.add("error");
    }
  }

  function renderHero(countries, totalHours){
    document.getElementById('hero-hours').innerHTML =
      (totalHours || "&hellip;") + " hours<br>on frequency.";

    const stripEl = document.getElementById('hero-strip');
    const legendEl = document.getElementById('hero-legend');
    stripEl.innerHTML = "";
    legendEl.innerHTML = "";

    countries.forEach(c => {
      const lux = isLux(c.name);
      const seg = document.createElement('div');
      seg.className = "strip-seg";
      seg.style.width = (c.perc || "0%");
      seg.style.background = lux ? "var(--amber-dim)" : "var(--green-dim)";
      seg.textContent = c.name.toUpperCase();
      stripEl.appendChild(seg);

      const legendItem = document.createElement('span');
      const dot = document.createElement('span');
      dot.className = "dot";
      dot.style.background = lux ? "var(--amber)" : "var(--green)";
      legendItem.appendChild(dot);
      legendItem.appendChild(document.createTextNode(
        titleCase(c.name) + " \u2014 " + c.hours + " h \u00b7 " + c.perc
      ));
      legendEl.appendChild(legendItem);
    });
  }

  function renderFacilities(facilities){
    const board = document.getElementById('board');
    const sub = document.getElementById('facility-sub');

    facilities.forEach((f, i) => {
      const lux = isLux(f.icao);
      const card = document.createElement('div');
      card.className = "strip-card" + (lux ? " lux" : "") + (i % 2 === 1 ? " in-right" : "");

      const idHtml = `
        <div class="strip-id">
          <div class="code">${f.icao}</div>
          <div class="name">${titleCase(f.adName)}</div>
        </div>`;

      const rowsHtml = f.positions.map(p => `
        <div class="pos-row">
          <span class="code">${CODE_OVERRIDES[p.pos] || p.pos.replace(f.icao + "_","")}</span>
          <span class="label">${titleCase(p.name)}</span>
          <span class="hrs">${p.hours} h</span>
          <span class="pct">${p.perc}</span>
        </div>`).join("");

      const totalHtml = `
        <div class="strip-total">
          <div class="hours">${f.hours}</div>
          <div class="pct">${f.perc}</div>
        </div>`;

      card.innerHTML = idHtml + `<div class="strip-rows">${rowsHtml}</div>` + totalHtml;
      board.appendChild(card);
    });

    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.2 });
    board.querySelectorAll('.strip-card').forEach(el => io.observe(el));
  }

  function renderTotals(facilities, totalHours){
    const totalsEl = document.getElementById('totals');
    const positionCount = facilities.reduce((n,f)=>n+f.positions.length,0);
    const cells = [
      { num: positionCount, lbl: "Positions worked" },
      { num: facilities.length, lbl: "Facilities covered" },
      { num: totalHours || "\u2014", lbl: "Total hours logged" },
    ];
    totalsEl.innerHTML = cells.map(c => `
      <div class="cell">
        <div class="num">${c.num}</div>
        <div class="lbl">${c.lbl}</div>
      </div>`).join("");

    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.2 });
    totalsEl.querySelectorAll('.cell').forEach(el => io.observe(el));
  }

  function renderMap(facilities){
    const statusEl = document.getElementById('map-status');
    const svg = document.getElementById('euromap');
    const dotsLayer = document.getElementById('map-dots');
    const tooltip = document.getElementById('map-tooltip');
    const wrap = document.getElementById('map-wrap');
    const svgNS = "http://www.w3.org/2000/svg";

    let maxPerc = 0;
    const placed = [];
    facilities.forEach(f => {
      const p = parseFloat(f.perc) || 0;
      if(p > maxPerc) maxPerc = p;
      const coord = resolveCoord(f.icao);
      if(coord) placed.push({ f, p, coord });
    });

    if(placed.length === 0){
      statusEl.textContent = "Couldn't place any facilities on the map (no matching coordinates).";
      statusEl.classList.add("error");
      return;
    }

    // largest first, smallest last: smaller dots get painted on top so they're
    // never hidden underneath (and unclickable behind) a bigger overlapping one
    placed.sort((a, b) => b.p - a.p);

    const maxR = 22;
    placed.forEach(({ f, p, coord }) => {
      const [lat, lon] = coord;
      const [x, y] = projectPoint(lat, lon);
      // area is directly proportional to share of total hours:
      // a facility with 10x the % gets a circle 10x the area (radius scales as sqrt).
      const r = maxPerc > 0 ? maxR * Math.sqrt(p / maxPerc) : 0;
      const lux = isLux(f.icao);

      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('cx', x.toFixed(1));
      circle.setAttribute('cy', y.toFixed(1));
      circle.setAttribute('r', r.toFixed(1));
      circle.setAttribute('class', 'map-dot' + (lux ? ' lux' : ''));
      circle.setAttribute('tabindex', '0');
      circle.setAttribute('role', 'img');
      const label = titleCase(f.adName) + " \u2014 " + f.hours + " h \u00b7 " + f.perc;
      circle.setAttribute('aria-label', label);

      const showTip = (evt) => {
        tooltip.querySelector('.t-name').textContent = titleCase(f.adName) + " (" + f.icao + ")";
        tooltip.querySelector('.t-meta').textContent = f.hours + " h \u00b7 " + f.perc + " of total";
        moveTip(evt);
        tooltip.classList.add('visible');
        circle.classList.add('active');
      };
      const moveTip = (evt) => {
        const rect = wrap.getBoundingClientRect();
        tooltip.style.left = (evt.clientX - rect.left) + "px";
        tooltip.style.top = (evt.clientY - rect.top) + "px";
      };
      const hideTip = () => {
        tooltip.classList.remove('visible');
        circle.classList.remove('active');
      };

      circle.addEventListener('pointerenter', showTip);
      circle.addEventListener('pointermove', moveTip);
      circle.addEventListener('pointerleave', hideTip);
      circle.addEventListener('focus', showTip);
      circle.addEventListener('blur', hideTip);

      dotsLayer.appendChild(circle);
    });

    statusEl.remove();
    svg.style.display = '';

    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          const dots = entry.target.querySelectorAll('.map-dot');
          dots.forEach((dot, i) => {
            setTimeout(() => dot.classList.add('visible'), i * 12);
          });
          io.disconnect();
        }
      });
    }, { threshold: 0.15 });
    io.observe(svg);
  }

  loadData();
</script>

    statusEl.textContent = "online now";
    var known = POSITIONS[callsign];
    if (known) {
      posEl.textContent = known[0] + "  ·  " + known[1];
    } else {
      // not in the manual table — fall back to raw callsign + feed frequency
      posEl.textContent = callsign + "  ·  " + freqFromFeed;
    }
  }

  function setError() {
    badge.classList.remove("live");
    statusEl.textContent = "status unavailable";
    posEl.textContent = "";
  }

  function pollFrequency() {
    fetch("https://data.vatsim.net/v3/vatsim-data.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var controllers = data.controllers || [];
        var mine = null;
        for (var i = 0; i < controllers.length; i++) {
          if (String(controllers[i].cid) === CID) {
            mine = controllers[i];
            break;
          }
        }
        if (mine) {
          setLive(mine.callsign, mine.frequency);
        } else {
          setOffline();
        }
      })
      .catch(function () {
        setError();
      });
  }

  pollFrequency();
  setInterval(pollFrequency, 300000); // refresh every 5 minutes
})();
</script>

</body>
</html>
